<!-- Version 6.3 -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Director Portal - HDCRS V6.3</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --primary: #00695C; --primary-dark: #004D40; --bg: #F5E4D0;
      --card: #ffffff; --text: #3E2723; --border: #D7CCC8;
      --danger: #C44536; --warn: #E65100; --success: #2E7D32;
    }
    * { box-sizing: border-box; }
    body { background: var(--bg); font-family: system-ui, sans-serif; margin: 0; padding: 1rem; color: var(--text); }
    .login-box { max-width: 400px; width: 100%; margin: 3rem auto 0; background: var(--card); border-radius: 20px; padding: 2rem 1.5rem; box-shadow: 0 8px 24px rgba(0,0,0,0.06); text-align: center; }
    .login-box h2 { color: var(--primary); margin: 0.5rem 0 1rem; }
    .login-label { display: block; text-align: left; font-size: 0.85rem; font-weight: 600; color: var(--text); margin-bottom: 0.2rem; margin-top: 0.5rem; }
    .login-label:first-of-type { margin-top: 0; }
    .login-box input { width: 100%; padding: 0.6rem; margin: 0.4rem 0; border: 1px solid var(--border); border-radius: 8px; font-size: 0.95rem; }
    .login-logo { max-width: 140px; margin-bottom: 0.5rem; }
    .container { max-width: 1300px; width: 100%; margin: 0 auto; background: var(--card); border-radius: 20px; padding: 1.5rem; box-shadow: 0 8px 24px rgba(0,0,0,0.06); }
    .dashboard-header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .dashboard-header img { height: 36px; }
    .dashboard-header h1 { color: var(--primary); margin: 0; font-size: 1.3rem; }
    .user-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 0.5rem 0 0; font-size: 0.9rem; color: #555; }
    .user-bar a { color: var(--primary); text-decoration: none; font-weight: 600; }
    .user-bar a:hover { text-decoration: underline; }
    .tab-bar { display: flex; gap: 0; margin: 1rem 0 0; border-bottom: 2px solid var(--border); }
    .tab-btn { padding: 0.6rem 1.5rem; border: none; background: transparent; color: #888; font-weight: 600; font-size: 0.95rem; cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px; transition: color 0.2s, border-color 0.2s; }
    .tab-btn:hover { color: var(--primary-dark); }
    .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }
    .btn { padding: 0.4rem 1rem; border: none; border-radius: 16px; cursor: pointer; font-weight: 600; margin: 0.15rem; font-size: 0.85rem; transition: opacity 0.15s; }
    .btn:hover { opacity: 0.85; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .approve { background: var(--primary); color: white; }
    .reject { background: var(--danger); color: white; }
    .view { background: #5D4037; color: white; }
    .btn-reviewed { background: var(--primary); color: white; }
    .btn-edit { background: #FF8F00; color: white; }
    .btn-save { background: var(--success); color: white; }
    .btn-date-range { background: #5D4037; color: white; }
    .hidden { display: none !important; }
    .error { color: var(--danger); margin-top: 0.5rem; min-height: 1.2rem; font-size: 0.9rem; }
    table { width: 100%; border-collapse: collapse; margin: 0.5rem 0; font-size: 0.85rem; }
    th { background: #f3e7da; color: var(--text); padding: 0.5rem; text-align: left; border-bottom: 2px solid var(--primary); font-weight: 600; }
    td { padding: 0.4rem 0.5rem; border-bottom: 1px solid var(--border); }
    .badge { padding: 0.15rem 0.6rem; border-radius: 10px; font-weight: 600; font-size: 0.8rem; display: inline-block; }
    .badge.Pending { background: #FFF3E0; color: #E65100; }
    .badge.Approved { background: #E0F2F1; color: var(--primary); }
    .badge.Rejected { background: #FFEBEE; color: var(--danger); }
    .badge.Reviewed { background: #E8F5E9; color: var(--success); }
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; }
    .modal-content { background: white; border-radius: 16px; padding: 1.5rem; max-width: 950px; width: 95%; max-height: 90vh; overflow-y: auto; }
    .modal-close { float: right; background: none; border: none; font-size: 1.4rem; cursor: pointer; color: #999; }
    .modal-actions { margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--border); }
    .modal-actions textarea { width: 100%; padding: 0.5rem; border: 1px solid var(--border); border-radius: 8px; font-family: inherit; font-size: 0.9rem; margin-bottom: 0.5rem; min-height: 60px; }
    .modal-actions .action-row { display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: flex-end; }
    .section { margin: 1.2rem 0 0.5rem; }
    .section h3 { color: var(--primary); margin: 0 0 0.3rem; font-size: 1rem; border-bottom: 1px solid var(--border); padding-bottom: 0.2rem; }
    .section table { font-size: 0.82rem; }
    .meta-grid { display: grid; grid-template-columns: 160px 1fr; gap: 0.2rem 10px; font-size: 0.9rem; }
    .meta-grid .label { font-weight: 600; color: #555; }
    .photo-grid { display: flex; flex-wrap: wrap; gap: 0.6rem; }
    .photo-grid img { max-width: 160px; max-height: 120px; border-radius: 8px; border: 1px solid var(--border); object-fit: cover; cursor: pointer; }
    .dashboard-loading { text-align: center; padding: 3rem 1rem; color: #888; font-size: 1rem; }
    .kpi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-bottom: 1.2rem; }
    .kpi-card { background: var(--card); border-radius: 16px; padding: 1.2rem; box-shadow: 0 2px 12px rgba(0,0,0,0.05); border: 1px solid var(--border); text-align: center; }
    .kpi-card .kpi-value { font-size: 2rem; font-weight: 700; color: var(--primary); line-height: 1.1; margin: 0.3rem 0; }
    .kpi-card .kpi-label { font-size: 0.8rem; color: #888; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    .kpi-card.kpi-pending .kpi-value { color: var(--warn); }
    .kpi-card.kpi-approved .kpi-value { color: var(--success); }
    .kpi-card.kpi-eff-high .kpi-value { color: var(--success); }
    .kpi-card.kpi-eff-mid .kpi-value { color: var(--warn); }
    .kpi-card.kpi-eff-low .kpi-value { color: var(--danger); }
    .rate-bar-outer { width: 80%; height: 10px; background: #E0E0E0; border-radius: 5px; margin: 0.5rem auto 0; overflow: hidden; }
    .rate-bar-inner { height: 100%; border-radius: 5px; background: var(--primary); transition: width 0.6s ease; }
    .charts-row { display: grid; gap: 1rem; margin-bottom: 1.2rem; }
    .charts-row.row-1 { grid-template-columns: 3fr 2fr; }
    .charts-row.row-2 { grid-template-columns: 1fr 1fr; }
    .chart-card { background: var(--card); border-radius: 16px; padding: 1rem; box-shadow: 0 2px 12px rgba(0,0,0,0.05); border: 1px solid var(--border); }
    .chart-card h3 { margin: 0 0 0.5rem; color: var(--primary); font-size: 0.95rem; font-weight: 600; }
    .chart-container { position: relative; height: 300px; width: 100%; }
    .weekly-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    .weekly-table th { background: #f3e7da; color: var(--text); padding: 0.5rem; text-align: left; border-bottom: 2px solid var(--primary); font-weight: 600; font-size: 0.82rem; }
    .weekly-table td { padding: 0.4rem 0.5rem; border-bottom: 1px solid var(--border); font-size: 0.85rem; }
    .issues-section { margin-bottom: 1rem; }
    .issues-section h3 { color: var(--primary); margin: 0 0 0.5rem; font-size: 1rem; font-weight: 600; }
    .issues-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 0.8rem; }
    .issue-card { background: var(--card); border: 1px solid var(--border); border-left: 4px solid var(--warn); border-radius: 12px; padding: 0.8rem 1rem; box-shadow: 0 1px 6px rgba(0,0,0,0.04); }
    .issue-card .issue-block { font-weight: 700; color: var(--primary-dark); font-size: 0.9rem; margin-bottom: 0.2rem; }
    .issue-card .issue-details { font-size: 0.85rem; color: #555; }
    .no-issues { text-align: center; padding: 1.5rem; color: #999; font-style: italic; }
    .edit-panel { background: #FFFDE7; border: 2px dashed #FF8F00; border-radius: 12px; padding: 1rem; margin: 1rem 0; }
    .edit-panel h4 { color: #E65100; margin: 0 0 0.6rem; font-size: 0.95rem; }
    .edit-panel label { display: block; font-size: 0.85rem; font-weight: 600; color: #555; margin: 0.5rem 0 0.2rem; }
    .edit-panel textarea, .edit-panel select, .edit-panel input { width: 100%; padding: 0.4rem; border: 1px solid var(--border); border-radius: 6px; font-family: inherit; font-size: 0.9rem; }
    .edit-panel textarea { min-height: 50px; }
    @media (max-width: 900px) {
      .kpi-grid { grid-template-columns: repeat(2, 1fr); }
      .charts-row.row-1, .charts-row.row-2 { grid-template-columns: 1fr; }
    }
    @media (max-width: 500px) {
      .kpi-grid { grid-template-columns: 1fr; }
      body { padding: 0.5rem; }
      .container { padding: 1rem; border-radius: 12px; }
      .login-box { padding: 1.5rem 1rem; border-radius: 12px; margin-top: 1.5rem; }
      .tab-btn { padding: 0.5rem 0.8rem; font-size: 0.85rem; }
    }
  </style>
</head>
<body>

  <div id="loginScreen" class="login-box">
    <img src="https://raw.githubusercontent.com/halbeeghdcrs-lab/HALBEEG-HDCRS/main/logo.png" alt="Halbeeg Logo" class="login-logo">
    <h2>Director Login</h2>
    <label for="loginName" class="login-label">Name</label>
    <input type="text" id="loginName" placeholder="Full Name">
    <label for="loginPassword" class="login-label">Password</label>
    <input type="password" id="loginPassword" placeholder="Password">
    <button class="btn approve" id="loginBtn" style="width:100%;padding:0.6rem;margin-top:0.5rem">Login</button>
    <div class="error" id="loginError"></div>
  </div>

  <div id="dashboard" class="container hidden">
    <div class="dashboard-header">
      <img src="https://raw.githubusercontent.com/halbeeghdcrs-lab/HALBEEG-HDCRS/main/logo.png" alt="Halbeeg Logo">
      <h1>Director Portal - HDCRS V6.3</h1>
    </div>
    <div class="user-bar">
      <span>Logged in as <strong id="loggedUser"></strong></span>
      <span>|</span>
      <a href="#" id="logoutLink">Logout</a>
      <button class="btn view" id="refreshBtn">Refresh</button>
    </div>

    <div class="tab-bar">
      <button class="tab-btn active" id="tabReports" data-tab="reports">Reports</button>
      <button class="tab-btn" id="tabAnalytics" data-tab="analytics">Analytics Dashboard</button>
    </div>

    <div id="reportsTab" style="margin-top:1rem">
      <div id="reportsTable">Loading...</div>
      <div id="message" class="error"></div>
    </div>

    <div id="analyticsTab" class="hidden" style="margin-top:1rem">
      <div style="background:var(--card);border-radius:12px;padding:1rem 1.2rem;margin-bottom:1rem;border:1px solid var(--border)">
        <h3 style="color:var(--primary);margin:0 0 0.5rem;font-size:1rem">Generate Period Report</h3>
        <p style="font-size:0.85rem;color:#666;margin:0 0 0.6rem">Generate a summary report for a date range (weekly, monthly, quarterly, etc.)</p>
        <div style="display:flex;flex-wrap:wrap;gap:0.8rem;align-items:flex-end">
          <div>
            <label style="font-weight:600;font-size:0.85rem;display:block;margin-bottom:0.2rem">From Report Date:</label>
            <input type="date" id="rangeFrom" style="padding:0.5rem;border:1px solid var(--border);border-radius:8px;font-size:0.95rem">
          </div>
          <div>
            <label style="font-weight:600;font-size:0.85rem;display:block;margin-bottom:0.2rem">To Report Date:</label>
            <input type="date" id="rangeTo" style="padding:0.5rem;border:1px solid var(--border);border-radius:8px;font-size:0.95rem">
          </div>
          <div>
            <label style="font-weight:600;font-size:0.85rem;display:block;margin-bottom:0.2rem">Site (optional):</label>
            <select id="rangeSite" style="padding:0.5rem 0.8rem;border:1px solid var(--border);border-radius:8px;font-size:0.95rem">
              <option value="">-- All Sites --</option>
            </select>
          </div>
          <button class="btn btn-date-range" id="genRangeReportBtn" style="padding:0.5rem 1.2rem">Generate Report</button>
        </div>
        <div id="rangeReportResult" style="margin-top:0.8rem;font-size:0.9rem"></div>
      </div>
      <div id="analyticsContent">
        <div class="dashboard-loading">Loading dashboard data...</div>
      </div>
    </div>
  </div>

  <div id="reportModal" class="modal-overlay hidden">
    <div class="modal-content">
      <button class="modal-close" id="modalCloseBtn">X</button>
      <div id="modalContent"></div>

      <div id="editPanel" class="edit-panel hidden">
        <h4>Edit Report Summary (DailyLog)</h4>
        <label for="editActivitySummary">Activity Summary</label>
        <textarea id="editActivitySummary"></textarea>
        <label for="editEfficiency">Resource Efficiency Rating</label>
        <select id="editEfficiency">
          <option value="">-- None --</option>
          <option>Excellent</option><option>Good</option><option>Fair</option><option>Poor</option>
        </select>
        <label for="editRecommendations">Recommendations</label>
        <textarea id="editRecommendations"></textarea>
        <label for="editHoldPoints">Hold Point Requests</label>
        <textarea id="editHoldPoints"></textarea>
      </div>

      <div class="modal-actions">
        <label for="directorComment" style="font-weight:600;font-size:0.85rem;color:#555">Director Comment (optional — saved on Review or Edit)</label>
        <textarea id="directorComment" placeholder="Any note for the record…"></textarea>
        <div class="action-row">
          <button class="btn btn-reviewed" id="modalReviewedBtn">Mark as Reviewed</button>
          <button class="btn btn-edit" id="modalEditBtn">Edit Summary</button>
          <button class="btn btn-save hidden" id="modalSaveBtn">Save Edits</button>
          <button class="btn reject hidden" id="modalCancelEditBtn">Cancel Edit</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    console.log('[Director] Portal V6.3 loaded');
    var API_BASE = 'https://script.google.com/macros/s/AKfycbyP6a_4bvB7qgPMEQYVMUiopSfYcI5JrsFHTb7tJjFkzVsQUJ6oolMiu9ZiroqRdYIU/exec';
    var currentReportId = null;
    var currentReportData = null;
    var loggedUser = sessionStorage.getItem('hdcre_director');
    var dashboardDataCache = null;
    var chartInstances = {};

    document.getElementById('loginBtn').addEventListener('click', attemptLogin);
    document.getElementById('logoutLink').addEventListener('click', function(e) { e.preventDefault(); logout(); });
    document.getElementById('refreshBtn').addEventListener('click', loadReports);
    document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
    document.getElementById('modalReviewedBtn').addEventListener('click', markReviewed);
    document.getElementById('modalEditBtn').addEventListener('click', enableEditMode);
    document.getElementById('modalSaveBtn').addEventListener('click', saveEdits);
    document.getElementById('modalCancelEditBtn').addEventListener('click', disableEditMode);
    document.getElementById('genRangeReportBtn').addEventListener('click', generateRangeReport);
    document.getElementById('tabReports').addEventListener('click', function() { switchTab('reports'); });
    document.getElementById('tabAnalytics').addEventListener('click', function() { switchTab('analytics'); });

    if (loggedUser) { showDashboard(loggedUser); }

    function switchTab(tabName) {
      var tabReports = document.getElementById('tabReports');
      var tabAnalytics = document.getElementById('tabAnalytics');
      var reportsTab = document.getElementById('reportsTab');
      var analyticsTab = document.getElementById('analyticsTab');
      if (tabName === 'reports') {
        tabReports.classList.add('active'); tabAnalytics.classList.remove('active');
        reportsTab.classList.remove('hidden'); analyticsTab.classList.add('hidden');
      } else {
        tabAnalytics.classList.add('active'); tabReports.classList.remove('active');
        analyticsTab.classList.remove('hidden'); reportsTab.classList.add('hidden');
        loadAnalyticsDashboard();
      }
    }

    function attemptLogin() {
      var name = document.getElementById('loginName').value.trim();
      var pw = document.getElementById('loginPassword').value.trim();
      var err = document.getElementById('loginError');
      var btn = document.getElementById('loginBtn');
      err.textContent = ''; err.style.color = '#C44536';
      if (!name || !pw) { err.textContent = 'Please enter both Name and Password.'; return; }
      btn.disabled = true; btn.textContent = 'Checking...';
      var url = API_BASE + '?action=login&name=' + encodeURIComponent(name) + '&password=' + encodeURIComponent(pw);
      fetch(url)
        .then(function(r) { if (!r.ok) throw new Error('Server returned ' + r.status); return r.text(); })
        .then(function(text) {
          var d;
          try { d = JSON.parse(text); }
          catch (e) { throw new Error('Backend did not return JSON. Raw: ' + text.slice(0, 200)); }
          var roleNorm = String(d.role || '').toUpperCase().replace(/[^A-Z]/g, '');
          if (d.success && roleNorm === 'DIRECTOR') {
            sessionStorage.setItem('hdcre_director', name);
            showDashboard(name);
            return;
          }
          if (d.success && d.role) {
            err.textContent = 'Access denied. Your role is "' + d.role + '" (raw: "' + (d.roleRaw || '?') + '"). This portal is for Directors only.';
            return;
          }
          if (d.success) { err.textContent = 'Login OK but no Role assigned.'; return; }
          var msg = 'Login failed. ';
          switch (d.reason) {
            case 'SHEET_NOT_FOUND': msg += 'No staff sheet found.'; break;
            case 'HEADERS_MISSING': msg += 'Staff sheet headers are wrong.'; break;
            case 'NO_MATCH': msg += 'Name/password did not match. Names: ' + (d.namesSample || []).join(', '); break;
            default: msg += (d.message || 'Invalid credentials.');
          }
          err.textContent = msg;
        })
        .catch(function(e) { err.textContent = e.message.indexOf('Failed to fetch') !== -1 ? 'Network error — cannot reach backend.' : 'Error: ' + e.message; })
        .finally(function() { btn.disabled = false; btn.textContent = 'Login'; });
    }

    function showDashboard(name) {
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('dashboard').classList.remove('hidden');
      document.getElementById('loggedUser').textContent = name;
      loadReports();
      loadSitesForFilter();
    }
    function logout() { sessionStorage.removeItem('hdcre_director'); location.reload(); }

    function loadSitesForFilter() {
      fetch(API_BASE + '?endpoint=sites')
        .then(function(r) { return r.json(); })
        .then(function(sites) {
          var sel = document.getElementById('rangeSite');
          sel.innerHTML = '<option value="">-- All Sites --</option>';
          (sites || []).forEach(function(s) {
            var o = document.createElement('option');
            o.value = s.name; o.textContent = s.name;
            sel.appendChild(o);
          });
        }).catch(function() {});
    }

    // ===== REPORTS TAB — V6.3 (separate Review / Approval columns) =====
    function loadReports() {
      var table = document.getElementById('reportsTable');
      table.innerHTML = '<p style="color:var(--primary)">Loading reports...</p>';
      fetch(API_BASE + '?endpoint=reports')
        .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .then(function(data) {
          var reports = Array.isArray(data) ? data : (data.reports || []);
          var html = '<table><tr><th>ID</th><th>Site</th><th>Date</th><th>RE</th><th>Weather</th><th>Efficiency</th><th>Review</th><th>Approval</th><th>Actions</th></tr>';
          if (reports.length === 0) {
            html += '<tr><td colspan="9">No reports found.</td></tr>';
          } else {
            for (var i = 0; i < reports.length; i++) {
              var r = reports[i];
              var displayDate = r.date || '';
              if (displayDate && displayDate.indexOf('T') > -1) {
                var d = new Date(displayDate);
                displayDate = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
              }
              var reviewStatus = r.reviewStatus || 'Pending';
              var approvalStatus = r.status || 'Pending';
              html += '<tr><td style="font-size:0.75rem">' + (r.id || '-') + '</td><td>' + (r.site || '-') + '</td><td>' + displayDate + '</td><td>' + (r.reName || '-') + '</td>';
              html += '<td>' + (r.weather || '-') + '</td><td>' + (r.efficiency || '-') + '</td>';
              html += '<td><span class="badge ' + reviewStatus.replace(/\s+/g,'') + '">' + reviewStatus + '</span></td>';
              html += '<td><span class="badge ' + approvalStatus.replace(/\s+/g,'') + '">' + approvalStatus + '</span></td>';
              html += '<td><button class="btn view" data-id="' + (r.id || '') + '">View</button></td></tr>';
            }
          }
          html += '</table>';
          table.innerHTML = html;
          var viewBtns = document.querySelectorAll('[data-id]');
          for (var j = 0; j < viewBtns.length; j++) {
            viewBtns[j].addEventListener('click', function() { viewReport(this.getAttribute('data-id')); });
          }
        })
        .catch(function(err) {
          table.innerHTML = '<p class="error">Failed to load reports: ' + err.message + '</p>';
        });
    }

    // ===== VIEW REPORT — V6.3 (photos + status + Reviewed lock) =====
    function viewReport(reportId) {
      currentReportId = reportId;
      fetch(API_BASE + '?endpoint=reportDetail&reportId=' + reportId)
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (!data.success) { alert('Could not load report: ' + (data.message || '')); return; }
          var rp = data.report;
          currentReportData = rp;

          var h = '<h2 style="color:var(--primary);margin-top:0">' + rp.site + ' - ' + rp.date + '</h2>';
          h += '<div class="meta-grid">';
          h += '<span class="label">Report ID:</span><span>' + rp.id + '</span>';
          h += '<span class="label">RE:</span><span>' + (rp.reName || '') + '</span>';
          h += '<span class="label">Weather:</span><span>' + (rp.weatherAM || '') + ' / ' + (rp.weatherPM || '') + '</span>';
          h += '<span class="label">Efficiency:</span><span>' + (rp.efficiency || 'N/A') + '</span>';
          h += '<span class="label">Director Review:</span><span class="badge ' + (rp.reviewStatus || 'Pending') + '">' + (rp.reviewStatus || 'Pending') + '</span>';
          h += '<span class="label">PM Approval:</span><span class="badge ' + (rp.status || 'Pending') + '">' + (rp.status || 'Pending') + '</span>';
          if (rp.directorComments) h += '<span class="label">Director Comment:</span><span>' + rp.directorComments + '</span>';
          h += '</div>';
          h += '<p><strong>Activity Summary:</strong> ' + (rp.activitySummary || '-') + '</p>';

          function renderSection(title, items, cols) {
            if (!items || items.length === 0) return '';
            var s = '<div class="section"><h3>' + title + '</h3><table><tr>';
            cols.forEach(function(c) { s += '<th>' + c + '</th>'; });
            s += '</tr>';
            items.forEach(function(item) {
              s += '<tr>';
              cols.forEach(function(c) { s += '<td>' + (item[c] || '') + '</td>'; });
              s += '</tr>';
            });
            return s + '</table></div>';
          }
          h += renderSection('Block Status', rp.blockStatuses, ['Block Name', 'Block Status', 'Target Achievement', 'Performance Status']);
          h += renderSection('Work Progress', rp.tasks, ['Block', 'Task Name', 'Unit', 'Planned QTY', 'Executed QTY', 'Daily Completion %', 'Cumulative Executed QTY', 'Overall Completion %', 'Remarks']);
          h += renderSection('Workforce', rp.workforce, ['Labor Type', 'Planned', 'Available', 'Comments']);
          h += renderSection('Equipment', rp.equipment, ['Equipment Type', 'Quantity', 'Working Condition', 'Comments']);
          h += renderSection('Materials Delivered', rp.materialsDelivered, ['Description', 'Unit', 'Quantity', 'Allocated Block']);
          h += renderSection('Materials On Site', rp.materialsOnSite, ['Description', 'Unit', 'Quantity', 'Allocated Block']);
          h += renderSection('Issues', rp.issues, ['Block', 'Issue Details']);
          h += renderSection('Tests', rp.tests, ['Test', 'Block', 'Result']);
          h += renderSection('Correspondences', rp.correspondences, ['Date', 'From', 'To', 'Subject']);
          h += renderSection('Safety Issues', rp.safetyIssues, ['Issue', 'Block', 'Action Taken']);
          h += renderSection('Stakeholder Contribution', rp.stakeholderContribution, ['Stakeholder', 'Contribution']);
          h += renderSection('Performance', rp.performance, ['Block', 'Daily Target Achievement', 'Status']);
          h += renderSection('Site Orders', rp.siteOrders, ['Order No', 'Issued To', 'Instruction', 'Deadline']);
          if (rp.holdPointRequests) h += '<div class="section"><h3>Hold-Point Requests</h3><p>' + rp.holdPointRequests + '</p></div>';

          // V6.3 — photos with thumbnail URL + lightbox open in Drive
          if (rp.photos && rp.photos.length) {
            h += '<div class="section"><h3>Site Photos (' + rp.photos.length + ')</h3><div class="photo-grid">';
            rp.photos.forEach(function(p) {
              if (!p.url) return;
              var fid = p.fileId || extractFileId(p.url);
              var src = fid ? ('https://drive.google.com/thumbnail?id=' + fid + '&sz=w1000') : p.url;
              var fallback = fid ? ('https://drive.google.com/uc?export=view&id=' + fid) : '';
              var onclick = fid ? ('window.open(\'https://drive.google.com/file/d/' + fid + '/view\',\'_blank\')') : '';
              h += '<img src="' + src + '" title="' + (p.caption || '') + (p.block ? ' — ' + p.block : '') + '" loading="lazy" ' +
                   'onerror="this.onerror=null; if(this.src.indexOf(\'thumbnail\')>-1){this.src=\'' + fallback + '\';}" ' +
                   'onclick="' + onclick + '">';
            });
            h += '</div><p style="font-size:0.8rem;color:#888;margin-top:0.4rem">Click any photo to open the full-size original in Google Drive.</p></div>';
          }

          document.getElementById('modalContent').innerHTML = h;
          document.getElementById('reportModal').classList.remove('hidden');
          document.getElementById('directorComment').value = rp.directorComments || '';

          // V6.3 — lock Reviewed button if already reviewed or approved
          var revBtn = document.getElementById('modalReviewedBtn');
          var alreadyDone = (rp.reviewStatus === 'Reviewed') || (rp.status === 'Approved');
          if (alreadyDone) {
            revBtn.disabled = true;
            revBtn.textContent = (rp.status === 'Approved') ? 'Already Approved' : 'Already Reviewed';
          } else {
            revBtn.disabled = false;
            revBtn.textContent = 'Mark as Reviewed';
          }

          disableEditMode();
        })
        .catch(function() { alert('Network error loading report.'); });
    }

    // V6.3 — extract a Drive fileId from any URL form
    function extractFileId(url) {
      if (!url) return '';
      var m = String(url).match(/\/d\/([a-zA-Z0-9_-]+)/);
      if (m) return m[1];
      m = String(url).match(/[?&]id=([a-zA-Z0-9_-]+)/);
      return m ? m[1] : '';
    }

    function closeModal() {
      document.getElementById('reportModal').classList.add('hidden');
      currentReportId = null; currentReportData = null;
    }

    function markReviewed() {
      if (!currentReportId) return;
      var comment = document.getElementById('directorComment').value.trim();
      fetch(API_BASE, {
        method: 'POST',
        body: JSON.stringify({
          action: 'reviewReport',
          reportId: currentReportId,
          directorName: loggedUser,
          status: 'Reviewed',
          comment: comment
        })
      })
      .then(function(r) { return r.json(); })
      .then(function(d) {
        if (d.success) alert('Report marked as Reviewed.' + (comment ? ' Comment saved.' : ''));
        else alert('Failed: ' + (d.message || 'Unknown error'));
      })
      .catch(function() { alert('Network error.'); })
      .finally(function() { closeModal(); loadReports(); });
    }

    function enableEditMode() {
      if (!currentReportData) return;
      document.getElementById('editPanel').classList.remove('hidden');
      document.getElementById('editActivitySummary').value = currentReportData.activitySummary || '';
      document.getElementById('editEfficiency').value = currentReportData.efficiency || '';
      document.getElementById('editRecommendations').value = currentReportData.recommendations || '';
      document.getElementById('editHoldPoints').value = currentReportData.holdPointRequests || '';
      document.getElementById('modalSaveBtn').classList.remove('hidden');
      document.getElementById('modalCancelEditBtn').classList.remove('hidden');
      document.getElementById('modalEditBtn').disabled = true;
    }

    function disableEditMode() {
      document.getElementById('editPanel').classList.add('hidden');
      document.getElementById('modalSaveBtn').classList.add('hidden');
      document.getElementById('modalCancelEditBtn').classList.add('hidden');
      document.getElementById('modalEditBtn').disabled = false;
    }

    function saveEdits() {
      if (!currentReportId) return;
      var updates = [];
      var newAct = document.getElementById('editActivitySummary').value;
      var newEff = document.getElementById('editEfficiency').value;
      var newRec = document.getElementById('editRecommendations').value;
      var newHp = document.getElementById('editHoldPoints').value;
      var comment = document.getElementById('directorComment').value.trim();

      if (newAct !== (currentReportData.activitySummary || '')) {
        updates.push({ sheet: 'DailyLog', column: 'Activity Summary', value: newAct });
      }
      if (newEff !== (currentReportData.efficiency || '')) {
        updates.push({ sheet: 'DailyLog', column: 'Resource Efficiency Rating', value: newEff });
      }
      if (newRec !== (currentReportData.recommendations || '')) {
        updates.push({ sheet: 'DailyLog', column: 'Recommendations', value: newRec });
      }
      if (newHp !== (currentReportData.holdPointRequests || '')) {
        updates.push({ sheet: 'DailyLog', column: 'Hold Point Requests', value: newHp });
      }
      if (comment && comment !== (currentReportData.directorComments || '')) {
        updates.push({ sheet: 'DailyLog', column: 'Director Comments', value: comment });
      }

      if (updates.length === 0) { alert('No changes to save.'); return; }

      fetch(API_BASE, {
        method: 'POST',
        body: JSON.stringify({
          action: 'directorEditReport',
          reportId: currentReportId,
          directorName: loggedUser,
          updates: updates
        })
      })
      .then(function(r) { return r.json(); })
      .then(function(d) {
        if (d.success) {
          alert('Saved: ' + (d.applied || updates.length) + ' field(s) updated in the sheet.');
          disableEditMode();
          loadReports();
        } else {
          alert('Failed: ' + (d.message || 'Unknown'));
        }
      })
      .catch(function() { alert('Network error saving edits.'); });
    }

    function generateRangeReport() {
      var from = document.getElementById('rangeFrom').value;
      var to = document.getElementById('rangeTo').value;
      var site = document.getElementById('rangeSite').value;
      var resultDiv = document.getElementById('rangeReportResult');
      if (!from || !to) { resultDiv.innerHTML = '<span style="color:var(--danger)">Please select both From and To dates.</span>'; return; }
      if (from > to) { resultDiv.innerHTML = '<span style="color:var(--danger)">From date must be before To date.</span>'; return; }

      resultDiv.innerHTML = 'Generating report...';
      var url = API_BASE + '?endpoint=rangeReport&from=' + from + '&to=' + to + (site ? '&site=' + encodeURIComponent(site) : '');
      fetch(url)
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (!data.success) { resultDiv.innerHTML = '<span style="color:var(--danger)">Error: ' + (data.message || 'Unknown') + '</span>'; return; }
          var reports = data.reports || [];
          var totalReports = reports.length;
          var totalIssues = 0;
          var avgEfficiency = 0, effCount = 0;
          var sites = {};
          var effMap = { 'Excellent': 95, 'Good': 75, 'Fair': 50, 'Poor': 25 };
          for (var i = 0; i < reports.length; i++) {
            var r = reports[i];
            if (r.site) sites[r.site] = (sites[r.site] || 0) + 1;
            if (r.efficiency && effMap[r.efficiency] != null) { avgEfficiency += effMap[r.efficiency]; effCount++; }
            if (r.issues && r.issues.length) totalIssues += r.issues.length;
          }
          if (effCount > 0) avgEfficiency = (avgEfficiency / effCount).toFixed(1);

          var html = '<div style="background:#f9f7f4;border-radius:8px;padding:1rem;border:1px solid var(--border);margin-top:0.5rem">';
          html += '<h4 style="color:var(--primary);margin:0 0 0.5rem">Period Report: ' + from + ' to ' + to + (site ? ' — ' + site : '') + '</h4>';
          html += '<table style="font-size:0.85rem"><tr><th>Metric</th><th>Value</th></tr>';
          html += '<tr><td>Total Reports</td><td>' + totalReports + '</td></tr>';
          html += '<tr><td>Avg Efficiency</td><td>' + (avgEfficiency || 'N/A') + (avgEfficiency ? '%' : '') + '</td></tr>';
          html += '<tr><td>Total Issues</td><td>' + totalIssues + '</td></tr>';
          html += '<tr><td>Sites Covered</td><td>' + Object.keys(sites).length + '</td></tr>';
          html += '</table>';
          if (Object.keys(sites).length > 0) {
            html += '<h5 style="margin:0.5rem 0 0.2rem;color:var(--primary-dark)">Reports per Site</h5><ul>';
            for (var s in sites) html += '<li>' + s + ': ' + sites[s] + ' reports</li>';
            html += '</ul>';
          }
          html += '</div>';
          resultDiv.innerHTML = html;
        })
        .catch(function(err) { resultDiv.innerHTML = '<span style="color:var(--danger)">Network error: ' + err.message + '</span>'; });
    }

    function destroyAllCharts() {
      Object.keys(chartInstances).forEach(function(k) {
        if (chartInstances[k]) { chartInstances[k].destroy(); chartInstances[k] = null; }
      });
      chartInstances = {};
    }

    function loadAnalyticsDashboard() {
      if (dashboardDataCache) { renderDashboard(dashboardDataCache); return; }
      var container = document.getElementById('analyticsContent');
      container.innerHTML = '<div class="dashboard-loading">Loading dashboard data...</div>';
      fetch(API_BASE + '?endpoint=dashboard')
        .then(function(r) { return r.json(); })
        .then(function(data) { dashboardDataCache = data; renderDashboard(data); })
        .catch(function() {
          container.innerHTML = '<div class="dashboard-loading" style="color:#C44536">Failed to load dashboard data.</div>';
        });
    }

    function renderDashboard(data) {
      destroyAllCharts();
      var kpis = data.kpis || {};
      var submissionTrend = data.submissionTrend || [];
      var workforceTrend = data.workforceTrend || [];
      var blockStatusSummary = data.blockStatusSummary || {};
      var topIssues = data.topIssues || [];
      var weeklySummary = data.weeklySummary || [];

      var effStr = String(kpis.avgEfficiency || '0%');
      var effNum = parseInt(effStr.replace('%', ''), 10) || 0;
      var effClass = 'kpi-eff-low';
      if (effNum > 80) effClass = 'kpi-eff-high';
      else if (effNum >= 50) effClass = 'kpi-eff-mid';

      var rateVal = parseInt(kpis.reportingRate, 10) || 0;
      var rateColor = '#00695C';
      if (rateVal < 30) rateColor = '#C44536'; else if (rateVal < 60) rateColor = '#E65100';

      var html = '';
      html += '<div class="kpi-grid">';
      html += '<div class="kpi-card"><div class="kpi-label">Total Reports</div><div class="kpi-value">' + (kpis.totalReports || 0) + '</div></div>';
      html += '<div class="kpi-card kpi-pending"><div class="kpi-label">Pending</div><div class="kpi-value">' + (kpis.pending || 0) + '</div></div>';
      html += '<div class="kpi-card kpi-approved"><div class="kpi-label">Approved</div><div class="kpi-value">' + (kpis.approved || 0) + '</div></div>';
      html += '<div class="kpi-card ' + effClass + '"><div class="kpi-label">Avg Efficiency</div><div class="kpi-value">' + effStr + '</div></div>';
      html += '<div class="kpi-card"><div class="kpi-label">Active Sites</div><div class="kpi-value">' + (kpis.activeSites || 0) + '</div></div>';
      html += '<div class="kpi-card"><div class="kpi-label">Reporting Rate (30d)</div><div class="kpi-value">' + (kpis.reportingRate || 0) + '%</div>';
      html += '<div class="rate-bar-outer"><div class="rate-bar-inner" style="width:' + Math.min(rateVal, 100) + '%;background:' + rateColor + '"></div></div></div>';
      html += '</div>';
      html += '<div class="charts-row row-1">';
      html += '<div class="chart-card"><h3>Submission Trend (Last 30 Days)</h3><div class="chart-container"><canvas id="chartSubmission"></canvas></div></div>';
      html += '<div class="chart-card"><h3>Block Status Distribution</h3><div class="chart-container"><canvas id="chartBlockStatus"></canvas></div></div>';
      html += '</div>';
      html += '<div class="charts-row row-2">';
      html += '<div class="chart-card"><h3>Workforce Trend (Last 7 Days)</h3><div class="chart-container"><canvas id="chartWorkforce"></canvas></div></div>';
      html += '<div class="chart-card"><h3>Weekly Summary</h3><div style="overflow-x:auto">';
      html += '<table class="weekly-table"><tr><th>Week Starting</th><th>Reports</th><th>Sites Covered</th></tr>';
      if (weeklySummary.length === 0) html += '<tr><td colspan="3" style="text-align:center;color:#999">No data available</td></tr>';
      else weeklySummary.forEach(function(ws) {
        html += '<tr><td>' + (ws.weekStart || '') + '</td><td>' + (ws.reports || 0) + '</td><td>' + (ws.sitesCovered || 0) + '</td></tr>';
      });
      html += '</table></div></div></div>';
      html += '<div class="issues-section"><h3>Recent Issues</h3>';
      if (topIssues.length === 0) html += '<div class="no-issues">No issues reported</div>';
      else {
        html += '<div class="issues-grid">';
        topIssues.forEach(function(issue) {
          html += '<div class="issue-card"><div class="issue-block">' + (issue.block || 'N/A') + '</div><div class="issue-details">' + (issue.details || 'No details') + '</div></div>';
        });
        html += '</div>';
      }
      html += '</div>';

      document.getElementById('analyticsContent').innerHTML = html;
      renderSubmissionChart(submissionTrend);
      renderBlockStatusChart(blockStatusSummary);
      renderWorkforceChart(workforceTrend);
    }

    function renderSubmissionChart(trend) {
      var labels = [], values = [];
      trend.forEach(function(t) { labels.push(t.date || ''); values.push(t.count || 0); });
      var ctx = document.getElementById('chartSubmission'); if (!ctx) return;
      chartInstances.submission = new Chart(ctx, {
        type: 'line',
        data: { labels: labels, datasets: [{ label: 'Reports', data: values, borderColor: '#00695C', backgroundColor: 'rgba(0,105,92,0.1)', fill: true, tension: 0.3, pointBackgroundColor: '#00695C', pointRadius: 3, borderWidth: 2 }] },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { grid: { display: false }, ticks: { maxRotation: 45, font: { size: 10 } } }, y: { beginAtZero: true, ticks: { stepSize: 1 }, grid: { color: 'rgba(0,0,0,0.05)' } } } }
      });
    }
    function renderBlockStatusChart(summary) {
      var labels = [], values = [];
      Object.keys(summary).forEach(function(k) { labels.push(k); values.push(summary[k]); });
      var ctx = document.getElementById('chartBlockStatus'); if (!ctx) return;
      var colors = ['#00695C', '#E65100', '#80CBC4', '#C44536', '#FFB74D', '#A5D6A7'];
      chartInstances.blockStatus = new Chart(ctx, {
        type: 'doughnut',
        data: { labels: labels, datasets: [{ data: values, backgroundColor: colors.slice(0, labels.length), borderWidth: 2, borderColor: '#fff' }] },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { padding: 16, usePointStyle: true, font: { size: 12 } } } }, cutout: '60%' }
      });
    }
    function renderWorkforceChart(trend) {
      var labels = [], planned = [], available = [];
      trend.forEach(function(t) { labels.push(t.date || ''); planned.push(t.planned || 0); available.push(t.available || 0); });
      var ctx = document.getElementById('chartWorkforce'); if (!ctx) return;
      chartInstances.workforce = new Chart(ctx, {
        type: 'bar',
        data: { labels: labels, datasets: [
          { label: 'Planned', data: planned, backgroundColor: '#00695C', borderRadius: 4 },
          { label: 'Available', data: available, backgroundColor: '#80CBC4', borderRadius: 4 }
        ] },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'top', labels: { usePointStyle: true, font: { size: 12 } } } }, scales: { x: { grid: { display: false } }, y: { beginAtZero: true, ticks: { stepSize: 5 }, grid: { color: 'rgba(0,0,0,0.05)' } } } }
      });
    }
  </script>
</body>
</html>
